<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --primary: #1e88e5;
      --secondary: #eceff1;
      --accent: #fbc02d;
      --card-bg: #ffffff;
      --danger: #f44336;

    body {

      padding: 0;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;

      padding: 1.8rem 0 0.8rem 0;
      font-size: 1.7rem;

    form {

      margin: 0.5rem auto 1.2rem auto;

      flex-direction: column;
      gap: 0.75rem;
      border: 1px solid #e3f2fd;
    }
    label {
      display: block;
      font-size: 0.96rem;
      color: var(--gray);
      margin-bottom: 0.18em;
    }
    input[type=text],
    input[type=number],
    select {
      width: 100%;
      padding: 0.52em 0.95em;
      background: #f5f7fa;
      border: 1px solid #cfd8dc;
      border-radius: .55em;
      font-size: 1.02rem;
      color: var(--text-main);
      margin-bottom: 0.2rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(30,136,229,0.16);
    }
    .form-row {
      display: flex;
      gap: .8em;
    }
    .form-row > div {
      flex: 1 0 0;
    }
    button[type=submit] {
      margin-top: .7rem;
      padding: 0.9em 0;
      background: linear-gradient(135deg, #1e88e5, #1976d2);
      color: #fff;
      font-size: 1.07rem;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(25,118,210,0.35);
      transition: background 0.18s, box-shadow 0.18s, transform 0.08s;
    }
    button[type=submit]:hover,
    button[type=submit]:focus {
      background: linear-gradient(135deg, #1565c0, #0d47a1);
      box-shadow: 0 8px 20px rgba(13,71,161,0.45);
      transform: translateY(-1px);
    }
    main {
      max-width: 960px;
      margin: 0 auto 2.4rem auto;
    }
    .registros-lista {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .tarjeta {
      background: var(--card-bg);
      border-radius: .65em;
      box-shadow: 0 2px 10px rgba(30,136,229,0.10), 0 0px 0.9px #26323814;
      padding: 1.0em 1.1em 0.81em 1.1em;
      display: flex;
      flex-direction: column;
      gap: 0.22em;
      position: relative;
      overflow: hidden;
    }
    .tarjeta .nombre {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--primary);
      margin-bottom: 0.27em;
    }
    .tarjeta .marca {
      color: var(--gray);
      font-size: 0.96em;
      margin-bottom: .14em;
    }
    .detalle {
      font-size: 1.08em;
      margin-bottom: 0.14em;
    }
    .tarjeta .precio-unidad {
      background: var(--accent);
      color: var(--primary);
      border-radius: .33em;
      padding: .19em .52em;
      font-size: .99em;
      display: inline-block;
      margin-top: .41em;
      font-weight: 600;
      letter-spacing: 0.01em;

    .eliminar-btn {

      right: 1.1em;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: .6em;
      padding: 0.26em 0.78em;
      font-size: 1.05em;

        padding-right:0.82em;

</head>

  <!-- Pestañas y contenido -->

  <!-- Funciones de sincronización con Google Sheets -->
  <script>
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwNQlCKSUWa5HHOvSpJt-kj_um8oifkV6ZA7qXJ9LGscqW2n5Z4ZyVXZpdFUUt5_NFz/exec'; // <-- misma URL de tu Web App

  // Función para formatear fecha a formato estándar DD/MM/YYYY HH:MM:SS
  function formatearFecha(fechaISO) {
    const fecha = new Date(fechaISO);
    const dia = String(fecha.getDate()).padStart(2, '0');
    const mes = String(fecha.getMonth() + 1).padStart(2, '0');
    const año = fecha.getFullYear();
    const horas = String(fecha.getHours()).padStart(2, '0');
    const minutos = String(fecha.getMinutes()).padStart(2, '0');
    const segundos = String(fecha.getSeconds()).padStart(2, '0');
    return `${dia}/${mes}/${año} ${horas}:${minutos}:${segundos}`;
  }

  // Alta de registros en Sheets
  async function guardarEnSheets(registro) {
    try {
      // Formateamos la fecha antes de enviarla
      const registroFormateado = {
        ...registro,
        fecha: formatearFecha(registro.fecha)
      };
      // Enviamos como "simple request" (text/plain) para evitar preflight CORS.
      const resp = await fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', ...registroFormateado })
      });
      // Opcional: si tu Apps Script devuelve JSON con confirmación/ID, podrías leerlo aquí
      // const data = await resp.json();
      // return data;
    } catch (err) {
      console.error('Error al enviar a Google Sheets:', err);
    }
  }

  // Listado completo desde Sheets
  async function listarDesdeSheets() {
    const resp = await fetch(SHEETS_URL + '?action=list');
    if (!resp.ok) throw new Error('Respuesta no OK desde Sheets');
    // Esperamos un array de objetos { id, fecha, producto, marca, precio, cantidad, unidad, unidades }
    const data = await resp.json();
    return Array.isArray(data) ? data : (data.data || []);
  }

  // Borrado de un registro en Sheets (por id)
  async function borrarDeSheets(registro) {
    if (!registro || !registro.id) return;
    try {
      // Enviamos como "simple request" (text/plain) para evitar preflight CORS.
      await fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: registro.id })
      });
    } catch (err) {
      console.error('Error al borrar en Google Sheets:', err);
    }
  }
  </script>

  <!-- Lógica de pestañas, filtros, orientación de precios y sincronización -->
  <script>
  // --- Utilidades de conversión y formato de precios ---
  function convertirUnidadEstandar(cantidad, unidad) {
    switch (unidad) {
      case 'g':
        return { cantidadEstandar: cantidad / 1000, unidadEstandar: 'kg' };
      case 'kg':
        return { cantidadEstandar: cantidad, unidadEstandar: 'kg' };
      case 'ml':
        return { cantidadEstandar: cantidad / 1000, unidadEstandar: 'l' };
      case 'l':
        return { cantidadEstandar: cantidad, unidadEstandar: 'l' };
      case 'unidad':
      default:
        return { cantidadEstandar: cantidad, unidadEstandar: 'unidad' };
    }
  }

  function calcularPrecioPorUnidad(precioUnitario, cantidadPorUnidad, unidad, unidades) {
    const totalUnidades = unidades || 1;
    const totalCantidad = cantidadPorUnidad * totalUnidades;
    const conversion = convertirUnidadEstandar(totalCantidad, unidad);
    if (conversion.cantidadEstandar <= 0) {
      return { precioPor: 0, unidadEstandar: conversion.unidadEstandar };
    }
    const precioTotal = precioUnitario * totalUnidades;
    const precioPor = precioTotal / conversion.cantidadEstandar;
    return { precioPor, unidadEstandar: conversion.unidadEstandar };
  }

  function formatoCLP(valor) {
    return '$ ' + Number(valor || 0).toLocaleString('es-CL', { maximumFractionDigits: 0 });
  }

  function calcularPrecioEstandarDeRegistro(reg) {
    return calcularPrecioPorUnidad(
      Number(reg.precio),
      Number(reg.cantidad),
      reg.unidad,
      Number(reg.unidades || 1)
    );
  }

  // --- Lógica de pestañas ---
  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      this.classList.add('active');
      const showTab = 'tab-' + this.getAttribute('data-tab');
      document.getElementById(showTab).classList.add('active');
      if (showTab === 'tab-registro') renderTablaRegistros();
    });
  });

  // --- Local y Google Sheets utilidad ---
  function obtenerRegistros() {
    try {
      const d = JSON.parse(localStorage.getItem('registros'));
      return Array.isArray(d) ? d : [];
    } catch {
      return [];
    }
  }
  function guardarRegistros(data) {
    localStorage.setItem('registros', JSON.stringify(data));
  }
  // Asumimos que existe la función guardarEnSheets y borrarDeSheets

  // --- Renderizado de registros en tabla con filtros y orden ---
  let ultimoSort = { campo: null, asc: true };
  const filtrosTexto = {}; // { campo: Set<string> } para columnas de texto

  function actualizarSugerenciasDesdeRegistros() {
    const registros = obtenerRegistros();
    const setProductos = new Set();
    const setMarcas = new Set();

    registros.forEach(reg => {
      if (reg.producto) setProductos.add(String(reg.producto).trim());
      if (reg.marca) setMarcas.add(String(reg.marca).trim());
    });

    const dlProd = document.getElementById('lista-productos');
    const dlMarca = document.getElementById('lista-marcas');
    if (!dlProd || !dlMarca) return;

    dlProd.innerHTML = '';
    dlMarca.innerHTML = '';

    Array.from(setProductos).sort().forEach(valor => {
      const opt = document.createElement('option');
      opt.value = valor;
      dlProd.appendChild(opt);
    });

    Array.from(setMarcas).sort().forEach(valor => {
      const opt = document.createElement('option');
      opt.value = valor;
      dlMarca.appendChild(opt);
    });
  }

  function aplicarFiltros(registros) {
    return registros.filter(reg => {
      // filtrosTexto mantiene valores exactos permitidos por campo
      for (const campo in filtrosTexto) {
        const setValores = filtrosTexto[campo];
        if (setValores && setValores.size > 0) {
          let valor = reg[campo];
          if (campo === 'fecha') {
            valor = (reg.fecha || '').substring(0, 10);
          }
          const clave = String(valor ?? '').toLowerCase();
          if (!setValores.has(clave)) return false;
        }
      }
      return true;
    });
  }

  function sortRegistros(registros, campo, asc) {
    return registros.slice().sort((a, b) => {
      let va = a[campo] ?? '', vb = b[campo] ?? '';
      if (campo === 'precio' || campo === 'cantidad' || campo === 'unidades') {
        va = parseFloat(va); vb = parseFloat(vb);
        if (isNaN(va)) va = 0; if (isNaN(vb)) vb = 0;
      }
      if (campo === 'fecha') {
        va = a.fecha || ''; vb = b.fecha || '';
      }
      if (va < vb) return asc ? -1 : 1;
      if (va > vb) return asc ? 1 : -1;
      return 0;
    });
  }

  // Renderizamos la tabla de registros
  function renderTablaRegistros() {
    actualizarSugerenciasDesdeRegistros();
    let registros = obtenerRegistros();
    // Filtros por cabecera
    registros = aplicarFiltros(registros);

    // Ordenamiento
    if (ultimoSort.campo) {
      registros = sortRegistros(registros, ultimoSort.campo, ultimoSort.asc);
    }

    // Render
    const tbody = document.getElementById('tabla-registros').querySelector('tbody');
    tbody.innerHTML = '';
    for (const reg of registros) {
      const std = calcularPrecioEstandarDeRegistro(reg);
      const textoStd = std.precioPor
        ? `${formatoCLP(Math.round(std.precioPor))} / 1 ${std.unidadEstandar}`
        : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${(reg.fecha || '').substring(0, 19).replace('T', ' ')}</td>
        <td>${reg.producto}</td>
        <td>${reg.marca}</td>
        <td>${reg.precio}</td>
      <td>${textoStd}</td>
        <td>${reg.cantidad}</td>
        <td>${reg.unidad}</td>
        <td>${reg.unidades ?? ''}</td>
        <td>
          <button class="delete-btn" data-id="${reg.id}">Borrar</button>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  // Manejo de orden y filtros desde las cabeceras
  let menuAbierto = null;

  function cerrarMenuFiltro() {
    if (menuAbierto && menuAbierto.parentElement) {
      menuAbierto.parentElement.removeChild(menuAbierto);
    }
    menuAbierto = null;
  }

  function abrirMenuFiltro(th) {
    cerrarMenuFiltro();
    const campo = th.getAttribute('data-sort');
    const registros = obtenerRegistros();

    // Reunimos valores únicos
    const valoresSet = new Set();
    registros.forEach(reg => {
      let valor = reg[campo];
      if (campo === 'fecha') valor = (reg.fecha || '').substring(0, 10);
      const clave = String(valor ?? '').toLowerCase();
      if (clave) valoresSet.add(clave);
    });

    const menu = document.createElement('div');
    menu.className = 'filter-menu';
    const valores = Array.from(valoresSet).sort();

    const seleccionados = filtrosTexto[campo] ? new Set(filtrosTexto[campo]) : new Set(valores);

    menu.innerHTML = `
      <h4>Filtrar ${campo}</h4>
      <div class="acciones"></div>
      <div class="opciones"></div>
    `;

    const divAcciones = menu.querySelector('.acciones');
    const divOpciones = menu.querySelector('.opciones');

    const btnTodos = document.createElement('button');
    btnTodos.type = 'button';
    btnTodos.textContent = 'Seleccionar todo';
    btnTodos.onclick = () => {
      divOpciones.querySelectorAll('input[type=checkbox]').forEach(ch => ch.checked = true);
    };

    const btnNinguno = document.createElement('button');
    btnNinguno.type = 'button';
    btnNinguno.textContent = 'Limpiar';
    btnNinguno.onclick = () => {
      divOpciones.querySelectorAll('input[type=checkbox]').forEach(ch => ch.checked = false);
    };

    divAcciones.appendChild(btnTodos);
    divAcciones.appendChild(btnNinguno);

    valores.forEach(valor => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = seleccionados.size === 0 || seleccionados.has(valor);
      input.value = valor;
      const texto = document.createElement('span');
      texto.textContent = valor || '(vacío)';
      label.appendChild(input);
      label.appendChild(texto);
      divOpciones.appendChild(label);
    });

    const btnAplicar = document.createElement('button');
    btnAplicar.type = 'button';
    btnAplicar.textContent = 'Aplicar';
    btnAplicar.style.marginTop = '4px';
    btnAplicar.onclick = () => {
      const nuevos = new Set();
      divOpciones.querySelectorAll('input[type=checkbox]').forEach(ch => {
        if (ch.checked) nuevos.add(ch.value);
      });
      filtrosTexto[campo] = nuevos;
      cerrarMenuFiltro();
      renderTablaRegistros();
    };

    const btnCerrar = document.createElement('button');
    btnCerrar.type = 'button';
    btnCerrar.textContent = 'Cerrar';
    btnCerrar.onclick = cerrarMenuFiltro;

    divAcciones.appendChild(btnAplicar);
    divAcciones.appendChild(btnCerrar);

    menu.addEventListener('click', ev => ev.stopPropagation());

    // Posicionamos el menú en coordenadas de ventana para que no se corte
    const rect = th.getBoundingClientRect();
    menu.style.left = rect.left + 'px';
    menu.style.top = (rect.bottom + 2) + 'px';

    document.body.appendChild(menu);
    menuAbierto = menu;
  }

  document.addEventListener('click', () => cerrarMenuFiltro());

  // Ordenamiento / filtros por encabezado
  document.querySelectorAll('#tabla-registros th[data-sort]').forEach(th => {
    th.addEventListener('click', function (ev) {
      ev.stopPropagation();
      const campo = th.getAttribute('data-sort');
      const tipo = th.getAttribute('data-type') || 'text';

      if (tipo === 'number') {
        // Solo ordenar asc/desc
        const asc = ultimoSort.campo === campo ? !ultimoSort.asc : true;
        ultimoSort = { campo, asc };
        renderTablaRegistros();
      } else {
        // Abrir menú de filtro tipo Excel
        abrirMenuFiltro(th);
      }
    });
  });
  // Manejo de borrado y sync con Google Sheets
  document.getElementById('tabla-registros').addEventListener('click', async function (ev) {
    if (ev.target.classList.contains('delete-btn')) {
      const id = ev.target.getAttribute('data-id');
      let registros = obtenerRegistros();
      const index = registros.findIndex(r => r.id === id);
      if (index >= 0) {
        const regElim = registros[index];
        if (confirm('¿Borrar este registro?')) {
          // Eliminar de Google Sheets
          if (regElim && typeof borrarDeSheets === "function") {
            try { await borrarDeSheets(regElim); } catch {}
          }
          // Eliminar localmente
          registros.splice(index, 1);
          guardarRegistros(registros);
          renderTablaRegistros();
        }
      }
    }
  });

  // --- Lógica de formulario con agregados y orientación de precios ---
  const miForm = document.getElementById('miForm');
  const infoPrecio = document.getElementById('info-precio');
  let registroPendiente = null;

  function mostrarInfoPrecio(nuevoRegistro, registrosHistoricos) {
    const { precioPor, unidadEstandar } = calcularPrecioPorUnidad(
      nuevoRegistro.precio,
      nuevoRegistro.cantidad,
      nuevoRegistro.unidad,
      nuevoRegistro.unidades
    );

    if (!precioPor || !isFinite(precioPor)) {
      infoPrecio.textContent = '';
      return;
    }

    const comparables = registrosHistoricos
      .map(r => {
        const std = calcularPrecioEstandarDeRegistro(r);
        return { ...r, precioStd: std.precioPor, unidadStd: std.unidadEstandar };
      })
      .filter(r =>
        r.producto &&
        r.marca &&
        r.precioStd &&
        r.producto.toLowerCase() === nuevoRegistro.producto.toLowerCase() &&
        r.marca.toLowerCase() === nuevoRegistro.marca.toLowerCase() &&
        r.unidadStd === unidadEstandar
      );

    if (!comparables.length) {
      infoPrecio.innerHTML =
        `Es la primera vez que registras <strong>${nuevoRegistro.producto}</strong> (${nuevoRegistro.marca}). ` +
        `Precio actual: <strong>${formatoCLP(Math.round(precioPor))} por 1 ${unidadEstandar}</strong>.`;
      return;
    }

    const precios = comparables.map(r => r.precioStd);
    const min = Math.min(...precios);
    const max = Math.max(...precios);
    const avg = precios.reduce((a, b) => a + b, 0) / precios.length;
    const diffPct = ((precioPor - avg) / avg) * 100;
    const masBarato = precioPor <= avg;
    const tendencia = masBarato ? 'más barato' : 'más caro';
    const color = masBarato ? '#2e7d32' : '#c62828';

    infoPrecio.innerHTML = `
      Precio actual: <strong>${formatoCLP(Math.round(precioPor))} / 1 ${unidadEstandar}</strong>.<br>
      Historial para <strong>${nuevoRegistro.producto}</strong> (${nuevoRegistro.marca}) ` +
      `en la misma unidad estándar (${comparables.length} registro(s)) – ` +
      `mínimo: <strong>${formatoCLP(Math.round(min))}</strong>, ` +
      `máximo: <strong>${formatoCLP(Math.round(max))}</strong>, ` +
      `promedio: <strong>${formatoCLP(Math.round(avg))}</strong>.<br>
      <span style="color:${color};font-weight:600;">
        Este precio está ${Math.abs(diffPct).toFixed(1)}% ${tendencia} que el promedio histórico.
      </span>
    `;
  }

  miForm.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const producto = miForm.producto.value.trim();
    const marca = miForm.marca.value.trim();
    const precio = parseInt(miForm.precio.value, 10);
    const cantidad = parseFloat(miForm.cantidad.value.replace(",", "."));
    const unidad = miForm.unidad.value;
    const unidades = parseInt(miForm.unidades.value, 10);

    if (!producto || !marca || isNaN(precio) || isNaN(cantidad) || isNaN(unidades) || unidades <= 0) {
      alert('Complete todos los campos correctamente.');
      return;
    }

    const fecha = new Date().toISOString();

    const nuevoRegistro = {
      id: 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2,6),
      fecha,
      producto,
      marca,
      precio,
      cantidad,
      unidad,
      unidades
    };

    // Guardamos referencia de los registros previos para comparar precios
    const registrosPrevios = obtenerRegistros();

    // Mostrar orientación de precio respecto al historial ANTES de guardar
    mostrarInfoPrecio(nuevoRegistro, registrosPrevios);

    // Crear estado de registro pendiente y botones de acción
    registroPendiente = { nuevoRegistro, registrosPrevios };

    // Añadimos botones de Confirmar / Descartar bajo el mensaje
    const accionesHtml = `
      <div id="acciones-precio" style="margin-top:0.6rem;display:flex;flex-wrap:wrap;gap:0.5rem;">
        <button type="button" id="btn-confirmar-registro"
          style="padding:0.4rem 0.9rem;border-radius:999px;border:none;background:#1e88e5;color:white;font-size:0.85rem;cursor:pointer;box-shadow:0 2px 6px rgba(25,118,210,0.4);">
          Confirmar registro
        </button>
        <button type="button" id="btn-cancelar-registro"
          style="padding:0.4rem 0.9rem;border-radius:999px;border:1px solid #cfd8dc;background:white;color:#455a64;font-size:0.85rem;cursor:pointer;">
          Cancelar
        </button>
      </div>
    `;
    infoPrecio.insertAdjacentHTML('beforeend', accionesHtml);

    const btnConfirmar = document.getElementById('btn-confirmar-registro');
    const btnCancelar = document.getElementById('btn-cancelar-registro');

    if (btnConfirmar) {
      btnConfirmar.onclick = async () => {
        if (!registroPendiente) return;
        btnConfirmar.disabled = true;
        btnCancelar.disabled = true;

        const { nuevoRegistro: reg, registrosPrevios: prev } = registroPendiente;

        // Intenta guardar en Google Sheets (online)
        try {
          await guardarEnSheets({
            fecha: reg.fecha,
            producto: reg.producto,
            marca: reg.marca,
            precio: reg.precio,
            cantidad: reg.cantidad,
            unidad: reg.unidad,
            unidades: reg.unidades
          });
        } catch (e) {
          console.warn('No se pudo enviar online. Guardando offline.');
        }

        // Guardar en localStorage (respaldo offline siempre)
        const registros = [reg, ...prev]; // más reciente primero
        guardarRegistros(registros);

        registroPendiente = null;

        infoPrecio.textContent = '';
        renderTablaRegistros();
        miForm.reset();
        miForm.producto.focus();
      };
    }

    if (btnCancelar) {
      btnCancelar.onclick = () => {
        registroPendiente = null;
        infoPrecio.textContent = '';
        miForm.reset();
        miForm.producto.focus();
      };
    }
  }, true);

  // -- Inicializaciones principales --
  renderTablaRegistros();

  // Intento de sincronización inicial con Google Sheets
  (async () => {
    try {
      const remotos = await listarDesdeSheets();
      if (Array.isArray(remotos) && remotos.length) {
        guardarRegistros(remotos);
        renderTablaRegistros();
      }
    } catch (e) {
      console.warn('No se pudo sincronizar inicialmente con Google Sheets:', e);
    }
  })();
  </script>
</body>
</html>
